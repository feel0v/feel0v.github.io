<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>feel0v glass player</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#0a0a0f;
}

/* glass bg */
.bg{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 20% 20%,rgba(255,255,255,0.08),transparent 40%),
             radial-gradient(circle at 80% 80%,rgba(120,120,255,0.08),transparent 40%);
  filter:blur(60px);
  z-index:-1;
}

/* card */
.player-card{
  width:340px;
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(25px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  color:white;
}

/* track */
.track-info{
  text-align:center;
  margin-bottom:14px;
}
.track-title{
  font-size:15px;
  font-weight:600;
  opacity:0.9;
}
.track-sub{
  font-size:11px;
  opacity:0.4;
}

/* controls */
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:12px 0;
}

.btn{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  padding:10px;
  border-radius:50%;
  cursor:pointer;
  transition:0.2s;
}
.btn:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.12);
}
.btn svg{
  fill:white;
  width:20px;
  height:20px;
}
.btn-main svg{
  width:26px;
  height:26px;
}

/* slider */
.volume-container{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.volume-slider{
  flex:1;
  height:4px;
  background:rgba(255,255,255,0.15);
  border-radius:2px;
  outline:none;
  -webkit-appearance:none;
}

.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  background:white;
}

/* links */
.links{
  margin-top:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.link{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  text-decoration:none;
  color:white;
  font-size:13px;
  transition:0.2s;
}
.link:hover{
  background:rgba(255,255,255,0.1);
  transform:translateY(-1px);
}
.link svg{
  width:18px;
  height:18px;
  fill:white;
}

/* hidden */
.hidden{display:none;}
</style>
</head>

<body>

<div class="bg"></div>

<div class="player-card">

  <div class="track-info">
    <div class="track-title">feel0v</div>
    <div class="track-sub">glass bio player</div>
  </div>

  <audio id="audio" src="tracks/gnoy.m4a"></audio>

  <div class="controls">
    <button class="btn" id="prev">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg>
    </button>

    <button class="btn btn-main" id="play">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <button class="btn btn-main hidden" id="pause">
      <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>

    <button class="btn" id="next">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
    </button>
  </div>

  <div class="volume-container">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
    <input class="volume-slider" id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
  </div>

  <div class="links">

    <a class="link" href="https://t.me/iiveriya" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M9.04 15.47l-.39 3.87c.56 0 .81-.24 1.11-.53l2.64-2.52 5.47 4c1 .56 1.7.27 1.96-.9L22.6 4.6c.33-1.31-.47-1.82-1.43-1.45L1.7 10.3c-1.28.5-1.26 1.2-.23 1.5l4.86 1.52L17.8 7.1c.6-.36 1.15-.16.7.2"/>
      </svg>
      Telegram
    </a>

    <a class="link" href="https://discord.gg/brawlstarsru" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M20 4s-2-1.5-4-2l-.5 1c-2-.5-4-.5-6 0L9 2C7 2.5 5 4 5 4 2 9 2 14 3 19c2 2 5 3 5 3l1-2c-1-.5-2-1-3-2 6 3 12 3 18 0-1 1-2 1.5-3 2l1 2s3-1 5-3c1-5 1-10-2-15z"/>
      </svg>
      Discord
    </a>

  </div>

</div>

<script>
const audio = document.getElementById("audio");

const play = document.getElementById("play");
const pause = document.getElementById("pause");
const vol = document.getElementById("vol");

play.onclick = () => {
  audio.play();
  play.classList.add("hidden");
  pause.classList.remove("hidden");
};

pause.onclick = () => {
  audio.pause();
  pause.classList.add("hidden");
  play.classList.remove("hidden");
};

vol.oninput = e => audio.volume = e.target.value;
</script>

</body>
</html>
