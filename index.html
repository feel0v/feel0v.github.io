<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>feel0v</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #000;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
}

#shaderCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.85;
}

.player-card {
    position: relative;
    z-index: 1;
    width: 400px;
    max-height: 90vh;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 40px 32px 32px;
    border-radius: 36px;
    background: rgba(20, 20, 28, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(80px) saturate(200%);
    -webkit-backdrop-filter: blur(80px) saturate(200%);
    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.5),
        0 0 0 0.5px rgba(255, 255, 255, 0.1) inset,
        0 1px 0 rgba(255, 255, 255, 0.05) inset;
    color: #f0f0f5;
    scrollbar-width: none;
    transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.player-card::-webkit-scrollbar { display: none; }

.player-card:hover {
    transform: translateY(-2px);
}

.avatar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
}

.avatar-ring {
    position: relative;
    width: 112px; height: 112px;
    margin-bottom: 20px;
}

.avatar-ring::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: linear-gradient(135deg,
        rgba(130, 160, 220, 0.25),
        rgba(160, 190, 240, 0.15),
        rgba(100, 140, 200, 0.2),
        rgba(180, 200, 240, 0.1));
    filter: blur(8px);
    animation: subtleRotate 12s linear infinite;
}

@keyframes subtleRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.avatar {
    width: 112px; height: 112px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.12);
    position: relative; z-index: 1;
    transition: all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.avatar:hover {
    transform: scale(1.04);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 12px 40px rgba(100, 140, 220, 0.2);
}

.username {
    font-size: 26px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
}

.bio-tag {
    font-size: 12px;
    font-weight: 400;
    color: rgba(200, 210, 235, 0.4);
    letter-spacing: 0.02em;
}

.status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
}

.status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #8ab4f8;
    box-shadow: 0 0 10px rgba(130, 170, 240, 0.5);
    animation: statusPulse 2.5s ease-in-out infinite;
}

@keyframes statusPulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
}

.status-text {
    font-size: 12px;
    font-weight: 400;
    color: rgba(200, 210, 235, 0.35);
    letter-spacing: 0.02em;
}

.divider {
    width: 100%;
    height: 0.5px;
    background: rgba(255, 255, 255, 0.06);
    margin: 20px 0;
}

.shader-switch-section {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
}

.shader-switch-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 0.5px solid rgba(255, 255, 255, 0.08);
    color: rgba(200, 210, 235, 0.5);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    letter-spacing: 0.3px;
}

.shader-switch-btn:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.12);
    color: rgba(210, 220, 245, 0.7);
    transform: translateY(-1px);
}

.shader-switch-btn:active {
    transform: scale(0.97);
}

.shader-switch-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(160, 190, 230, 0.6);
    transition: all 0.3s ease;
}

.shader-switch-btn:hover .shader-switch-dot {
    background: rgba(180, 210, 250, 0.8);
    box-shadow: 0 0 8px rgba(160, 200, 240, 0.4);
}

.shader-flyout {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.8) translate(-50%, -50%);
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.shader-flyout.active {
    opacity: 1;
    transform: scale(1) translate(-50%, -50%);
    pointer-events: auto;
}

.shader-menu {
    background: rgba(10, 12, 18, 0.94);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 6px;
    min-width: 140px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 0.5px rgba(255, 255, 255, 0.03);
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.shader-option {
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: rgba(200, 210, 235, 0.5);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    text-align: left;
    background: transparent;
    border: none;
    font-family: 'Inter', sans-serif;
    transform: translateY(6px);
    opacity: 0;
}

.shader-flyout.active .shader-option {
    transform: translateY(0);
    opacity: 1;
}

.shader-flyout.active .shader-option:nth-child(1) { transition-delay: 0.02s; }
.shader-flyout.active .shader-option:nth-child(2) { transition-delay: 0.05s; }
.shader-flyout.active .shader-option:nth-child(3) { transition-delay: 0.08s; }

.shader-option:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #c0c8e0;
}

.shader-option.active-shader {
    background: rgba(255, 255, 255, 0.07);
    color: #d8ddf0;
    font-weight: 600;
}

.music-section { margin-bottom: 4px; }

.music-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 0.5px solid rgba(255, 255, 255, 0.06);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    user-select: none;
}

.music-header:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.1);
}

.music-header-left { display: flex; align-items: center; gap: 12px; }

.music-icon svg {
    width: 18px; height: 18px;
    fill: rgba(200, 210, 235, 0.45);
    transition: fill 0.3s ease;
}

.music-header:hover .music-icon svg { fill: rgba(210, 220, 245, 0.7); }

.music-label {
    font-size: 13px; font-weight: 500;
    color: rgba(200, 210, 235, 0.5);
    letter-spacing: 0.01em;
    transition: color 0.3s ease;
}

.music-header:hover .music-label { color: rgba(210, 220, 245, 0.75); }

.music-arrow {
    transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    opacity: 0.4;
}

.music-header:hover .music-arrow { opacity: 0.7; }

.music-arrow svg { width: 16px; height: 16px; fill: rgba(200, 210, 235, 0.5); }
.music-arrow.open { transform: rotate(180deg); }

.music-player {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.25, 0.1, 0.25, 1),
                margin 0.5s cubic-bezier(0.25, 0.1, 0.25, 1),
                opacity 0.35s ease;
    opacity: 0;
    margin-top: 0;
}

.music-player.open { max-height: 700px; opacity: 1; margin-top: 10px; }

.music-player-inner {
    padding: 20px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.02);
    border: 0.5px solid rgba(255, 255, 255, 0.05);
}

.track-now {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
}

.track-art-big {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(100, 140, 220, 0.2), rgba(140, 170, 230, 0.1));
    border: 0.5px solid rgba(255, 255, 255, 0.08);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}

.track-art-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(200, 215, 240, 0.2);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.track-art-dot.playing {
    animation: dotPulse 2.5s ease-in-out infinite;
    background: rgba(200, 215, 240, 0.4);
    border-color: rgba(255, 255, 255, 0.25);
}

@keyframes dotPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

.track-info-col { flex: 1; min-width: 0; }

.track-name {
    font-size: 14px; font-weight: 600;
    color: #e8ebf5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.01em;
}

.track-artist {
    font-size: 11px; font-weight: 400;
    color: rgba(200, 210, 235, 0.35);
    margin-top: 3px;
    letter-spacing: 0.01em;
}

.progress-container { margin: 16px 0 12px; }

.progress-bar {
    width: 100%; height: 3px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    cursor: pointer;
    position: relative; overflow: visible;
    transition: height 0.2s ease;
}

.progress-bar:hover { height: 4px; }

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(140, 170, 220, 0.6), rgba(180, 200, 240, 0.8));
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    position: relative;
}

.progress-fill::after {
    content: '';
    position: absolute;
    right: -5px; top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #d0daf0;
    opacity: 0;
    transition: opacity 0.3s ease;
    box-shadow: 0 0 12px rgba(180, 200, 240, 0.4);
}

.progress-bar:hover .progress-fill::after { opacity: 1; }

.time-display {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px; font-weight: 500;
    color: rgba(200, 210, 235, 0.25);
    letter-spacing: 0.02em;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin: 20px 0 16px;
}

.btn {
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.btn:hover { transform: scale(1.08); }
.btn:active { transform: scale(0.95); }

.btn svg { fill: rgba(200, 210, 235, 0.4); width: 18px; height: 18px; transition: fill 0.3s ease; }
.btn:hover svg { fill: rgba(220, 230, 250, 0.85); }

.btn-main {
    background: rgba(255, 255, 255, 0.08);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    padding: 14px;
    border-radius: 50%;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.btn-main:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow: 0 6px 20px rgba(100, 140, 220, 0.2);
}

.btn-main svg { width: 22px; height: 22px; fill: #d0daf0; }

.volume-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

.volume-icon { cursor: pointer; transition: opacity 0.3s ease; flex-shrink: 0; opacity: 0.4; }
.volume-icon:hover { opacity: 0.7; }
.volume-icon svg { width: 15px; height: 15px; fill: rgba(200, 210, 235, 0.5); }

.volume-slider {
    flex: 1; height: 3px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    outline: none;
    -webkit-appearance: none;
    cursor: pointer;
    transition: height 0.2s ease;
}

.volume-slider:hover { height: 4px; }

.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #d0daf0;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 8px rgba(180, 200, 240, 0.3);
}

.volume-slider:hover::-webkit-slider-thumb {
    width: 14px; height: 14px;
    box-shadow: 0 0 14px rgba(180, 200, 240, 0.5);
}

.playlist {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
}

.playlist::-webkit-scrollbar { display: none; }

.playlist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.playlist-item:hover { background: rgba(255, 255, 255, 0.03); }
.playlist-item.active { background: rgba(255, 255, 255, 0.05); }

.playlist-item-number {
    font-size: 11px; font-weight: 500;
    color: rgba(200, 210, 235, 0.2);
    width: 22px; flex-shrink: 0;
    letter-spacing: 0.02em;
}

.playlist-item.active .playlist-item-number { color: rgba(160, 185, 225, 0.5); }

.playlist-item-title {
    flex: 1; font-size: 11px; font-weight: 400;
    color: rgba(200, 210, 235, 0.35);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.01em;
}

.playlist-item.active .playlist-item-title { color: #c8d5f0; font-weight: 500; }

.playlist-item-duration {
    font-size: 10px; font-weight: 500;
    color: rgba(200, 210, 235, 0.18);
    flex-shrink: 0;
}

.telegram-section { margin-top: 20px; }

.telegram-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 0.5px solid rgba(255, 255, 255, 0.06);
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.telegram-link:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.1);
    transform: translateY(-1px);
}

.telegram-link span {
    font-size: 13px; font-weight: 500;
    color: rgba(200, 210, 235, 0.45);
    letter-spacing: 0.01em;
    transition: color 0.3s ease;
}

.telegram-link:hover span { color: rgba(210, 220, 245, 0.7); }

.telegram-link svg { width: 18px; height: 18px; fill: rgba(200, 210, 235, 0.35); transition: fill 0.3s ease; }
.telegram-link:hover svg { fill: rgba(180, 200, 240, 0.6); }

.hidden { display: none !important; }

@media (max-width: 440px) {
    .player-card { width: 92vw; padding: 32px 22px 26px; border-radius: 30px; }
    .username { font-size: 24px; }
    .avatar-ring { width: 96px; height: 96px; }
    .avatar { width: 96px; height: 96px; }
}
</style>
</head>
<body>

<canvas id="shaderCanvas"></canvas>

<div class="player-card">
    <div class="avatar-section">
        <div class="avatar-ring">
            <img class="avatar" src="avatar.jpg" alt="feel0v" onerror="this.style.display='none'; this.parentElement.style.display='none';">
        </div>
        <div class="username">feel0v</div>
        <div class="bio-tag">ds: incassatorswag</div>
    </div>

    <div class="status-row">
        <div class="status-dot"></div>
        <span class="status-text">sleep</span>
    </div>

    <div class="divider"></div>

    <div class="shader-switch-section">
        <button class="shader-switch-btn" id="shaderSwitchBtn">
            <span class="shader-switch-dot"></span>
            шейдер
        </button>
    </div>

    <div class="divider"></div>

    <div class="music-section">
        <div class="music-header" id="musicToggle">
            <div class="music-header-left">
                <div class="music-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <span class="music-label">Music</span>
            </div>
            <div class="music-arrow" id="musicArrow">
                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
        </div>

        <div class="music-player" id="musicPlayer">
            <div class="music-player-inner">
                <audio id="audio" preload="auto"></audio>

                <div class="track-now">
                    <div class="track-art-big">
                        <div class="track-art-dot" id="miniTrackArtInner"></div>
                    </div>
                    <div class="track-info-col">
                        <div class="track-name" id="trackTitle">Not Playing</div>
                        <div class="track-artist" id="trackArtist"></div>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn" id="prev">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg>
                    </button>
                    <button class="btn btn-main" id="play">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="btn btn-main hidden" id="pause">
                        <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                    </button>
                    <button class="btn" id="next">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
                    </button>
                </div>

                <div class="volume-row">
                    <div class="volume-icon" id="volumeIcon">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
                    </div>
                    <input class="volume-slider" id="vol" type="range" min="0" max="1" step="0.01" value="0.7">
                </div>

                <div class="playlist" id="playlist"></div>
            </div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="telegram-section">
        <a class="telegram-link" href="https://t.me/iiveriya" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M9.04 15.47l-.39 3.87c.56 0 .81-.24 1.11-.53l2.64-2.52 5.47 4c1 .56 1.7.27 1.96-.9L22.6 4.6c.33-1.31-.47-1.82-1.43-1.45L1.7 10.3c-1.28.5-1.26 1.2-.23 1.5l4.86 1.52L17.8 7.1c.6-.36 1.15-.16.7.2"/></svg>
            <span>Telegram</span>
        </a>
    </div>
</div>

<div class="shader-flyout" id="shaderFlyout">
    <div class="shader-menu">
        <button class="shader-option active-shader" data-shader="0">1</button>
        <button class="shader-option" data-shader="1">2</button>
        <button class="shader-option" data-shader="2">3</button>
    </div>
</div>

<script>
const canvas = document.getElementById('shaderCanvas');
const gl = canvas.getContext('webgl2', {
    antialias: false,
    powerPreference: 'low-power'
});

if (!gl) {
    document.body.innerHTML = '<div style="color:white;text-align:center;padding-top:40vh;font-family:Inter,sans-serif;">WebGL 2 не поддерживается</div>';
    throw new Error('WebGL2 required');
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vertSrc = `#version 300 es
    in vec4 position;
    void main() {
        gl_Position = position;
    }
`;

const fragSrcs = [
    `#version 300 es
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    out vec4 fragColor;

    float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
    }

    float sceneSDF(vec3 p) {
        float t = u_time * 0.15;
        float c = cos(t * 0.3), s = sin(t * 0.3);
        p.xz *= mat2(c, -s, s, c);
        p.xy *= mat2(c, s, -s, c);
        float boundSphere = length(p) - 1.8;
        vec3 q = p * 1.8;
        float d1 = (sin(q.x + t) * cos(q.y + t) + sin(q.y - t) * cos(q.z) + sin(q.z + t) * cos(q.x)) * 0.35;
        vec3 q2 = p * 3.2 + vec3(t);
        float d2 = (sin(q2.x) * cos(q2.y) + sin(q2.y) * cos(q2.z) + sin(q2.z) * cos(q2.x)) * 0.15;
        float knot = smin(d1, d2, 0.2);
        return max(boundSphere, knot);
    }

    vec3 getNormal(vec3 p) {
        vec2 e = vec2(0.003, 0.0);
        return normalize(vec3(
            sceneSDF(p + e.xyy) - sceneSDF(p - e.xyy),
            sceneSDF(p + e.yxy) - sceneSDF(p - e.yxy),
            sceneSDF(p + e.yyx) - sceneSDF(p - e.yyx)

    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        vec3 ro = vec3(0.0, 0.0, 2.6);
        vec3 rd = normalize(vec3(uv, -1.0));
        vec3 color = mix(vec3(0.02, 0.03, 0.06), vec3(0.06, 0.08, 0.13), length(uv) * 0.7);
        float t = 0.0;
        bool hit = false;
        vec3 p;
        for(int i = 0; i < 55; i++) {
            p = ro + rd * t;
            float d = sceneSDF(p);
            if(d < 0.001) { hit = true; break; }
            t += d;
            if(t > 4.2) break;
        }
        if(hit) {
            vec3 n = getNormal(p);
            vec3 viewDir = normalize(ro - p);
            vec3 lightDir1 = normalize(vec3(3.0, 4.0, 3.0) - p);
            vec3 reflectDir1 = reflect(-lightDir1, n);
            vec3 lightDir2 = normalize(vec3(-3.0, -2.0, 1.0) - p);
            float chromeMap = dot(n, vec3(0.1, 0.9, 0.2)) * 0.5 + 0.5;
            vec3 baseColor = mix(vec3(0.06, 0.08, 0.14), vec3(0.13, 0.18, 0.27), chromeMap);
            baseColor = mix(baseColor, vec3(0.27, 0.32, 0.41), pow(chromeMap, 3.0));
            float fresnel = pow(clamp(1.0 - dot(n, viewDir), 0.0, 1.0), 3.0);
            float spec = pow(max(dot(viewDir, reflectDir1), 0.0), 32.0);
            float shadowLight = max(dot(n, lightDir2), 0.0) * 0.15;
            color = baseColor + vec3(0.33, 0.38, 0.46) * fresnel * 0.6 + vec3(0.45, 0.48, 0.5) * spec * 1.4 + shadowLight * vec3(0.27, 0.32, 0.41);
            color *= smoothstep(-0.4, 0.6, n.z);
            color *= mix(0.5, 1.0, smoothstep(0.0, 0.3, sceneSDF(p + n * 0.2)));

        color = pow(color, vec3(0.67));

    }`,

    `#version 300 es
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    out vec4 fragColor;

    float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
    }

    float noise(vec3 p) {
        return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
    }

    float sceneSDF(vec3 p) {
        float t = u_time * 0.15;
        vec3 a1 = p + vec3(sin(t * 1.1) * 0.5, cos(t * 0.9) * 0.4, sin(t * 0.5) * 0.2);
        vec3 a2 = p + vec3(cos(t * 0.8) * 0.5, sin(t * 1.2) * 0.4, cos(t * 0.7) * 0.3);
        vec3 a3 = p + vec3(sin(t * 0.6) * 0.4, cos(t * 0.5) * 0.5, sin(t * 1.0) * 0.4);
        return smin(length(a1) - 0.55, smin(length(a2) - 0.48, length(a3) - 0.42, 0.45), 0.45);
    }

    vec3 getNormal(vec3 p) {
        vec2 e = vec2(0.003, 0.0);
        return normalize(vec3(
            sceneSDF(p + e.xyy) - sceneSDF(p - e.xyy),
            sceneSDF(p + e.yxy) - sceneSDF(p - e.yxy),
            sceneSDF(p + e.yyx) - sceneSDF(p - e.yyx)
        ));
    }

    vec3 getBackground(vec2 uv) {
        return mix(vec3(0.03, 0.05, 0.07), vec3(0.06, 0.09, 0.16), uv.y + 0.5);
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        vec3 ro = vec3(0.0, 0.0, 2.3);
        vec3 rd = normalize(vec3(uv, -1.0));
        vec3 color = getBackground(uv);
        float t = 0.0;
        bool hit = false;
        vec3 p;
        for(int i = 0; i < 55; i++) {
            p = ro + rd * t;
            float d = sceneSDF(p);
            if(d < 0.001) { hit = true; break; }
            t += d;
            if(t > 3.6) break;
        }
        if(hit) {
            vec3 n = getNormal(p);
            vec3 viewDir = normalize(ro - p);
            float diffuse = dot(n, vec3(0.3, 0.9, 0.2)) * 0.5 + 0.5;
            vec3 glassBodyColor = mix(vec3(0.08, 0.11, 0.18), vec3(0.21, 0.26, 0.34), diffuse);
            vec3 refractionDir = refract(rd, n, 0.75);
            vec2 refractedUV = uv + refractionDir.xy * 0.25;
            refractedUV += (vec2(noise(p*10.0), noise(p*11.0)) - 0.5) * 0.015;
            vec3 refractedBg = getBackground(refractedUV);
            float thickness = clamp(t * 0.4, 0.0, 1.0);
            vec3 glassAbsorption = mix(vec3(0.4, 0.43, 0.48), vec3(0.05, 0.09, 0.15), thickness);
            float fresnel = pow(clamp(1.0 - dot(n, viewDir), 0.0, 1.0), 3.0);
            color = mix(refractedBg * glassAbsorption, glassBodyColor, 0.45);
            color += vec3(0.33, 0.37, 0.43) * fresnel * 0.5;
            color *= smoothstep(-0.3, 0.6, n.z);
        }
        color = clamp(color, 0.0, 1.0);
        color = pow(color, vec3(0.75));
        fragColor = vec4(color, 1.0);
    }`,

    `#version 300 es
    precision highp float;
    uniform vec2 u_resolution;
    uniform float u_time;
    out vec4 fragColor;

    float hash(vec3 p) {
        p = fract(p * vec3(443.8975, 397.2973, 491.1871));
        p += dot(p.xyz, p.yzx + 19.19);
        return fract(p.x * p.y * p.z);
    }

    float noise3D(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
            mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
            mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
    }

    float sceneSDF(vec3 p) {
        float t = u_time * 0.12;
        p.x += sin(p.z * 0.5 + t) * 0.3;
        p.y += cos(p.x * 0.4 - t) * 0.2;
        vec3 q = p * 1.6;
        float turingPattern = abs(sin(q.x+t)*cos(q.y-t) + sin(q.y+t)*cos(q.z) + sin(q.z)*cos(q.x)) - 0.45;
        float microNoise = noise3D(p * 3.5 + t) * 0.15;
        return max(turingPattern + microNoise, length(p) - 2.2);
    }

    vec3 getNormal(vec3 p) {
        vec2 e = vec2(0.003, 0.0);
        return normalize(vec3(
            sceneSDF(p + e.xyy) - sceneSDF(p - e.xyy),
            sceneSDF(p + e.yxy) - sceneSDF(p - e.yxy),
            sceneSDF(p + e.yyx) - sceneSDF(p - e.yyx)
        ));
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;
        vec3 ro = vec3(0.0, 0.0, 2.0);
        vec3 rd = normalize(vec3(uv, -1.0));
        vec3 color = mix(vec3(0.02, 0.03, 0.05), vec3(0.04, 0.06, 0.11), length(uv) * 0.9);
        float t = 0.0;
        bool hit = false;
        vec3 p;
        for(int i = 0; i < 60; i++) {
            p = ro + rd * t;
            float d = sceneSDF(p);
            if(d < 0.001) { hit = true; break; }
            t += d;
            if(t > 3.6) break;
        }
        if(hit) {
            vec3 n = getNormal(p);
            vec3 viewDir = normalize(ro - p);
            vec3 lightDir1 = normalize(vec3(5.0, 6.0, 4.0) - p);
            vec3 reflectDir1 = reflect(-lightDir1, n);
            vec3 lightDir2 = normalize(vec3(-4.0, -3.0, -2.0) - p);
            float chromeFactor = dot(n, vec3(0.2, 0.85, 0.3)) * 0.5 + 0.5;
            vec3 baseColor = mix(vec3(0.04, 0.06, 0.09), vec3(0.11, 0.16, 0.24), chromeFactor);
            baseColor = mix(baseColor, vec3(0.28, 0.33, 0.41), pow(chromeFactor, 4.0));
            float fresnel = pow(clamp(1.0 - dot(n, viewDir), 0.0, 1.0), 3.5);
            float spec = pow(max(dot(viewDir, reflectDir1), 0.0), 40.0);
            float fillLight = max(dot(n, lightDir2), 0.0) * 0.2;
            color = baseColor + vec3(0.33, 0.38, 0.47) * fresnel * 0.65 + vec3(0.45, 0.48, 0.5) * spec * 1.5 + fillLight * vec3(0.11, 0.16, 0.24);
            float ao = clamp(sceneSDF(p + n * 0.25) / 0.25, 0.0, 1.0);
            color *= mix(0.3, 1.0, ao);
            color *= smoothstep(-0.5, 0.6, n.z);
        }
        color = clamp(color, 0.0, 1.0);
        color = pow(color, vec3(0.625));
        fragColor = vec4(color, 1.0);
    }`
];

function makeShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

function createProgram(fragSrc) {
    const prog = gl.createProgram();
    gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(prog);
    return prog;
}

let programs = fragSrcs.map(createProgram);
let currentShader = 0;

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

let start = Date.now();
let lastFrameTime = 0;
const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || window.innerWidth < 768;
const maxFPS = isMobile ? 30 : 60;
const frameInterval = 1000 / maxFPS;

function loop(timestamp) {
    requestAnimationFrame(loop);
    if (timestamp - lastFrameTime < frameInterval) return;
    lastFrameTime = timestamp;
    const t = (Date.now() - start) * 0.001;
    const prog = programs[currentShader];
    gl.useProgram(prog);
    gl.uniform2f(gl.getUniformLocation(prog, 'u_resolution'), canvas.width, canvas.height);
    gl.uniform1f(gl.getUniformLocation(prog, 'u_time'), t);
    const posLoc = gl.getAttribLocation(prog, 'position');
    gl.enableVertexAttribArray(posLoc);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

requestAnimationFrame(loop);

const shaderSwitchBtn = document.getElementById('shaderSwitchBtn');
const shaderFlyout = document.getElementById('shaderFlyout');
const shaderOptions = document.querySelectorAll('.shader-option');
let flyoutVisible = false;

function positionFlyout() {
    const btnRect = shaderSwitchBtn.getBoundingClientRect();
    shaderFlyout.style.left = (btnRect.left + btnRect.width / 2) + 'px';
    shaderFlyout.style.top = (btnRect.top - 8) + 'px';
}

shaderSwitchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    positionFlyout();
    shaderFlyout.classList.toggle('active');
    flyoutVisible = !flyoutVisible;
});

document.addEventListener('click', (e) => {
    if (flyoutVisible && !shaderFlyout.contains(e.target) && e.target !== shaderSwitchBtn) {
        shaderFlyout.classList.remove('active');
        flyoutVisible = false;
    }
});

window.addEventListener('scroll', () => { if (flyoutVisible) positionFlyout(); });
window.addEventListener('resize', () => { if (flyoutVisible) positionFlyout(); });

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && flyoutVisible) {
        shaderFlyout.classList.remove('active');
        flyoutVisible = false;
    }
});

shaderOptions.forEach(option => {
    option.addEventListener('click', () => {
        currentShader = parseInt(option.dataset.shader);
        shaderOptions.forEach(o => o.classList.remove('active-shader'));
        option.classList.add('active-shader');
        shaderFlyout.classList.remove('active');
        flyoutVisible = false;
    });
});

const musicToggle = document.getElementById('musicToggle');
const musicPlayer = document.getElementById('musicPlayer');
const musicArrow = document.getElementById('musicArrow');
let open = false;

musicToggle.onclick = () => {
    open = !open;
    musicPlayer.classList.toggle('open', open);
    musicArrow.classList.toggle('open', open);
};

const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const pauseBtn = document.getElementById('pause');
const volSlider = document.getElementById('vol');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const curTimeEl = document.getElementById('currentTime');
const durEl = document.getElementById('duration');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const artInner = document.getElementById('miniTrackArtInner');
const playlistEl = document.getElementById('playlist');
const volIcon = document.getElementById('volumeIcon');

const tracks = [
    { title: "gnoy", file: "tracks/gnoy.m4a" },
    { title: "Chalice of the Mind x Hardbass", file: "tracks/Hardbass.m4a" },
    { title: "Not anywhere", artist: "aaron g", file: "tracks/notanywhere.m4a" },
    { title: "bedrott", file: "tracks/bedrott.m4a" },
    { title: "beatles", file: "tracks/beatles.m4a" },
    { title: "upast", file: "tracks/upast.m4a" },
    { title: "konec", file: "tracks/konec.m4a" },
    { title: "navalny", file: "tracks/navalny.m4a" },
    { title: "lamour", file: "tracks/lamour.m4a" },
    { title: "vanished", file: "tracks/vanished.mp3" }
];

let idx = 0, playing = false;

function buildList() {
    playlistEl.innerHTML = '';
    tracks.forEach((t, i) => {
        const el = document.createElement('div');
        el.className = 'playlist-item' + (i === idx ? ' active' : '');
        el.innerHTML = `
            <span class="playlist-item-number">${(i+1).toString().padStart(2,'0')}</span>
            <span class="playlist-item-title">${t.title}</span>
            <span class="playlist-item-duration">--:--</span>
        `;
        el.onclick = () => { load(i); if(!playing) toggle(); };
        playlistEl.appendChild(el);
    });
}

function updActive() {
    playlistEl.querySelectorAll('.playlist-item').forEach((el, i) => el.classList.toggle('active', i === idx));
}

function load(i) {
    idx = i;
    audio.src = tracks[i].file;
    trackTitle.textContent = tracks[i].title;
    trackArtist.textContent = tracks[i].artist || '';
    updActive();
    if(playing) audio.play().catch(()=>{});
}

function toggle() {
    if(playing) {
        audio.pause();
        playing = false;
        playBtn.classList.remove('hidden');
        pauseBtn.classList.add('hidden');
        artInner.classList.remove('playing');
    } else {
        audio.play().catch(()=>{});
        playing = true;
        playBtn.classList.add('hidden');
        pauseBtn.classList.remove('hidden');
        artInner.classList.add('playing');
    }
}

load(0);
buildList();

playBtn.onclick = toggle;
pauseBtn.onclick = toggle;

prevBtn.onclick = () => { idx = (idx-1+tracks.length)%tracks.length; load(idx); if(!playing) toggle(); };
nextBtn.onclick = () => { idx = (idx+1)%tracks.length; load(idx); if(!playing) toggle(); };

audio.onended = () => { idx = (idx+1)%tracks.length; load(idx); if(!playing) toggle(); };

volSlider.oninput = e => audio.volume = e.target.value;

let lastVol = 0.7;
volIcon.onclick = () => {
    if(audio.volume > 0) { lastVol = audio.volume; audio.volume = 0; volSlider.value = 0; }
    else { audio.volume = lastVol; volSlider.value = lastVol; }
};

audio.ontimeupdate = () => {
    if(!audio.duration) return;
    progressFill.style.width = (audio.currentTime/audio.duration*100) + '%';
    const m = Math.floor(audio.currentTime/60);
    const s = Math.floor(audio.currentTime%60);
    curTimeEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
};

audio.onloadedmetadata = () => {
    const m = Math.floor(audio.duration/60);
    const s = Math.floor(audio.duration%60);
    durEl.textContent = `${m}:${s.toString().padStart(2,'0')}`;
};

progressBar.onclick = e => {
    audio.currentTime = ((e.clientX - progressBar.getBoundingClientRect().left) / progressBar.offsetWidth) * audio.duration;
};

document.onkeydown = e => {
    if(e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); }
};
</script>
